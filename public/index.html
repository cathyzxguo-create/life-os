<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c4507b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="生活 OS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mimi 生活 OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: Notion 式工作区 —— 左侧页面树（总 Dashboard / 私人 AI），右侧页面：封面 + 图标 + 标题 + 块。夜里像她的 Notion 暗色页，白天是干净纸面，粉调 callout */
:root{
  --bg:#ffffff; --side:#f7f6f3; --card:#ffffff; --fg:#37352f; --muted:#787774; --faint:#a5a29c; --line:#e9e9e7; --hover:rgba(55,53,47,.06);
  --accent:#c4507b; --accent-fg:#ffffff; --callout:#f7e9ef; --callout2:#f1f1ef;
  --ok:#448361; --warn:#cb7b37; --bad:#d44c47;
  --cv1:90%; --cv2:80%; --cover-fg:#2d2027;
  --c-gray:#e3e2e0; --c-brown:#eee0da; --c-orange:#fadec9; --c-yellow:#fdecc8; --c-green:#dbeddb; --c-blue:#d3e5ef; --c-purple:#e8deee; --c-pink:#f5e0e9; --c-red:#ffe2dd; --pill-fg:#32302c;
  --ff:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif;
  --ff-serif:"Instrument Serif","Songti SC","STSong",Georgia,serif;
  --ff-mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919; --side:#202020; --card:#202020; --fg:#e6e3df; --muted:#9b9a97; --faint:#6f6e6b; --line:#2f2f2f; --hover:rgba(255,255,255,.055);
  --accent:#e58cab; --accent-fg:#221018; --callout:#45303b; --callout2:#252525;
  --ok:#5aa57d; --warn:#d9935a; --bad:#e2675f; --cv1:20%; --cv2:9%; --cover-fg:#f6eef1;
  --c-gray:#373737; --c-brown:#5b3b2c; --c-orange:#7d4a1f; --c-yellow:#7f5f28; --c-green:#2b593f; --c-blue:#28456c; --c-purple:#492f64; --c-pink:#69314c; --c-red:#6e3630; --pill-fg:rgba(255,255,255,.88);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --side:#202020; --card:#202020; --fg:#e6e3df; --muted:#9b9a97; --faint:#6f6e6b; --line:#2f2f2f; --hover:rgba(255,255,255,.055);
  --accent:#e58cab; --accent-fg:#221018; --callout:#45303b; --callout2:#252525;
  --ok:#5aa57d; --warn:#d9935a; --bad:#e2675f; --cv1:20%; --cv2:9%; --cover-fg:#f6eef1;
  --c-gray:#373737; --c-brown:#5b3b2c; --c-orange:#7d4a1f; --c-yellow:#7f5f28; --c-green:#2b593f; --c-blue:#28456c; --c-purple:#492f64; --c-pink:#69314c; --c-red:#6e3630; --pill-fg:rgba(255,255,255,.88);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ff);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}

/* ---------- sidebar ---------- */
.side{background:var(--side);position:sticky;top:0;height:100vh;overflow-y:auto;padding:max(10px,env(safe-area-inset-top,0px)) 8px 20px max(8px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.ws{display:flex;align-items:center;gap:8px;padding:6px 8px 10px;font-weight:600;font-size:14px}
.ws-av{width:22px;height:22px;border-radius:5px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--ff-serif);font-style:italic;font-size:15px}
.slabel{font-size:12px;color:var(--muted);font-weight:600;padding:12px 8px 4px}
.sgroup{display:flex;flex-direction:column;gap:1px}
.sitem{display:flex;align-items:center;gap:7px;border:0;background:none;width:100%;text-align:left;padding:4px 8px 4px calc(8px + var(--ind,0) * 14px);border-radius:6px;cursor:pointer;color:var(--muted);font-size:14px;min-height:30px}
.sitem:hover{background:var(--hover)}
.sitem.on{background:var(--hover);color:var(--fg);font-weight:600}
.sicon{width:20px;flex:none;text-align:center;font-size:14px}
.sl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.sfoot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:1px}

/* ---------- main ---------- */
.mainwrap{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;min-height:46px;padding:max(6px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;font-size:14px;overflow:hidden;white-space:nowrap}
.crumb{border:0;background:none;padding:3px 6px;border-radius:5px;cursor:pointer;color:var(--fg);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.crumb:hover{background:var(--hover)}
.crumbs .sep{color:var(--faint)}
.burger{display:none;border:0;background:none;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px}
.burger:hover{background:var(--hover)}
.page{padding-bottom:120px}
.inner{max-width:1080px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.inner.narrow{max-width:860px}

/* cover + header */
.cover{position:relative;height:clamp(150px,26vw,270px);overflow:hidden;background:var(--callout2)}
.cover img{width:100%;height:100%;object-fit:cover;display:block;max-width:100%}
.art{position:absolute;inset:0;background:
  radial-gradient(55% 90% at 80% 25%,hsl(var(--h) 60% 62% / .55),transparent 62%),
  radial-gradient(45% 80% at 12% 90%,hsl(calc(var(--h) + 38) 55% 58% / .45),transparent 66%),
  radial-gradient(30% 50% at 45% 45%,hsl(calc(var(--h) - 25) 50% 70% / .25),transparent 70%),
  linear-gradient(135deg,hsl(var(--h) 32% var(--cv1)),hsl(calc(var(--h) - 18) 26% var(--cv2)))}
.art::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}
.slogan{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--ff-serif);font-size:clamp(30px,5.5vw,58px);color:var(--cover-fg);letter-spacing:.01em;text-shadow:0 2px 24px rgba(0,0,0,.25);padding:0 20px;text-align:center}
.cover-tools{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:10px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
.cover:hover .cover-tools,.cover:focus-within .cover-tools{opacity:1}
@media (hover:none){.cover-tools{opacity:1}}
.cover-tools button{border:0;border-radius:5px;background:rgba(255,255,255,.85);color:#37352f;font-size:12.5px;padding:4px 9px;cursor:pointer}
.phead{position:relative;display:flex;flex-direction:column;gap:6px;padding-top:14px}
.picon{font-size:64px;line-height:1;margin-top:-50px;height:78px;display:flex;align-items:flex-end;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
.picon.nocover{margin-top:28px}
.ptitle{font-size:clamp(30px,4.6vw,40px);font-weight:700;line-height:1.15;letter-spacing:-.01em}
.pdesc{color:var(--muted);font-size:15px}
.blocks{display:flex;flex-direction:column;gap:22px;padding-top:18px}

/* blocks */
h2.bh{font-size:22px;font-weight:700;margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2.bh .bh-r{margin-left:auto;display:flex;gap:6px;font-size:13px;font-weight:400}
.quote{border-left:3px solid currentColor;padding:2px 16px;font-size:17px}
.quote .q2{color:var(--muted)}
.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.columns.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.colstack{display:flex;flex-direction:column;gap:12px;min-width:0}
.callout{display:flex;gap:10px;padding:16px 16px 16px 14px;border-radius:6px;background:var(--callout);min-width:0}
.callout.grey{background:var(--callout2)}
.callout .ci{font-size:20px;line-height:1.3;flex:none}
.callout .cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ct{font-weight:600}
.wantlist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.wantlist li::marker{color:var(--muted)}
.wantlist button{border:0;background:none;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.mini{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.vision{border-radius:6px;overflow:hidden;background:var(--callout2);aspect-ratio:4/3;max-width:100%;position:relative}
.vision img{width:100%;height:100%;object-fit:cover;display:block}
.vision .addimg{position:absolute;inset:0;border:1.5px dashed var(--line);border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-size:13.5px}
.vision .cover-tools{opacity:0}
.vision:hover .cover-tools{opacity:1}
.affirm{font-size:21px;font-weight:700;line-height:1.3;white-space:pre-wrap;color:var(--muted);letter-spacing:.01em}
.affirm2{font-style:italic;color:var(--accent);font-weight:600;white-space:pre-wrap}
.affirm3{font-size:24px;font-weight:800;font-style:italic;white-space:pre-wrap}
details.toggle{border-radius:6px}
details.toggle>summary{list-style:none;cursor:pointer;display:flex;gap:6px;align-items:center;font-weight:600;padding:2px 0}
details.toggle>summary::-webkit-details-marker{display:none}
details.toggle>summary::before{content:"▸";color:var(--muted);font-size:12px;width:14px;transition:transform .15s}
details.toggle[open]>summary::before{transform:rotate(90deg)}
details.toggle .tbody{padding:6px 0 2px 20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.todo{display:flex;align-items:flex-start;gap:8px}
.todo input{margin-top:4px;width:15px;height:15px;accent-color:var(--accent);flex:none}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{flex:1;min-width:0}

/* capture */
.cap-ta{width:100%;border:0;background:transparent;resize:vertical;min-height:58px;font-size:16px;outline:none;line-height:1.5}
.cap-ta::placeholder{color:var(--faint)}
.cap-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cap-files{display:flex;gap:6px;flex-wrap:wrap}
.cap-files:empty{display:none}

/* buttons, pills */
.btn{border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.small{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;line-height:1.5;padding:0 7px;border-radius:4px;background:var(--c-gray);color:var(--pill-fg);white-space:nowrap}
.c-gray{background:var(--c-gray)}.c-brown{background:var(--c-brown)}.c-orange{background:var(--c-orange)}.c-yellow{background:var(--c-yellow)}.c-green{background:var(--c-green)}.c-blue{background:var(--c-blue)}.c-purple{background:var(--c-purple)}.c-pink{background:var(--c-pink)}.c-red{background:var(--c-red)}
.pill button{border:0;background:none;padding:0;cursor:pointer;color:inherit}
.pbar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.linkbtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:13px;border-radius:4px}
.linkbtn:hover{background:var(--hover);color:var(--fg)}
.linkbtn.arm{color:var(--bad);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* galleries */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gcard{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card);border-radius:7px;overflow:hidden;cursor:pointer;text-align:left;padding:0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.gcard:hover{background:var(--hover)}
.gcover{position:relative;height:128px;overflow:hidden;background:var(--callout2)}
.gcover img{width:100%;height:100%;object-fit:cover;display:block}
.gc-body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:7px}
.gc-t{font-weight:600;font-size:14.5px;display:flex;gap:6px;align-items:center;min-width:0}
.gc-t span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-props{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.gnew{border:1px dashed var(--line);border-radius:7px;background:none;color:var(--muted);cursor:pointer;min-height:200px;font-size:14px}
.gnew:hover{background:var(--hover);color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.kpi{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:11px 12px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:hover{background:var(--hover)}
.kh{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.kv{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.ks{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{width:100%;height:26px;margin-top:4px}
.spark path{fill:none;stroke:var(--accent);stroke-width:1.5}
.spark .sa{fill:var(--accent);opacity:.1;stroke:none}

/* view tabs + tables */
.viewbar{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap;padding-bottom:4px}
.vtab{border:0;background:none;padding:4px 9px;border-radius:5px;cursor:pointer;color:var(--muted);font-size:14px;white-space:nowrap}
.vtab:hover{background:var(--hover)}
.vtab.on{color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--fg);border-radius:5px 5px 0 0}
.vtools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vtools input,.vtools select{width:auto;min-width:0;padding:4px 8px;font-size:13.5px}
.vtools input[type=text]{width:160px}
.vtools select{width:auto}
.tablewrap{overflow-x:auto;border-top:1px solid var(--line)}
.ntable{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
.ntable th{font-weight:400;color:var(--muted);text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;font-size:13.5px}
.ntable td{padding:7px 9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.ntable th:last-child,.ntable td:last-child{border-right:0}
.ntable tbody tr{cursor:pointer}
.ntable tbody tr:hover td{background:var(--hover)}
.ntable td.tl{font-weight:600}
.ntable td input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);margin:2px 0 0}
.ntable .newrow td{color:var(--faint);font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .ch{font-size:12px;color:var(--muted);padding:4px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:right}
.cal .cd{min-height:92px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal .cd:hover{background:var(--hover)}
.cal .cd.out{background:color-mix(in srgb,var(--hover) 60%,transparent)}
.cal .dn{font-size:12px;color:var(--muted);text-align:right}
.cal .cd.today .dn{color:var(--accent-fg);background:var(--accent);border-radius:999px;align-self:flex-end;padding:0 6px}
.cal .ev{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.cal .ev.done{text-decoration:line-through;color:var(--muted)}
.calnav{display:flex;align-items:center;gap:6px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.bcol{flex:0 0 240px;background:var(--callout2);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:90px}
.bcol.closed{opacity:.75}
.bcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.bch{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:5px;font-size:14px}
.bcard:hover{background:var(--hover)}
.bcard.dragging{opacity:.4}
.bt{font-weight:600;overflow-wrap:anywhere}
.bmeta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.overdue{color:var(--bad)!important}
.recall.grey{background:var(--callout2)}
.vision-q{font-family:var(--ff-serif);font-style:italic;font-size:20px;color:var(--muted)}
.wlist{display:flex;flex-direction:column}
.witem{align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.witem:last-child{border-bottom:0}
.witem .btn{flex:none}
.vdot{width:15px;text-align:center;color:var(--accent);flex:none}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.phase{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:5px;background:var(--card)}
.phase.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.phase.past{opacity:.6}
.recall.grey b{color:var(--muted)}

/* properties (goal page) */
.props{display:flex;flex-direction:column;gap:2px;font-size:14.5px;border-bottom:1px solid var(--line);padding-bottom:12px}
.prop{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;min-height:32px;align-items:center}
.prop .pl{color:var(--muted);display:flex;gap:7px;align-items:center}
.prop .pl i{font-style:normal;width:16px;text-align:center}
.prop .pv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.prop .pbar{width:140px}
.pactions{display:flex;gap:6px;flex-wrap:wrap}
.tmpl-h{font-weight:700;font-size:16px;margin-top:6px}
.blist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
.oblist{display:flex;flex-direction:column}
.obrow{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr) auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);align-items:start}
.obrow .ar{color:var(--faint)}
.inline-form{display:flex;gap:8px;flex-wrap:wrap}

async function boot() {
  render(true);

  if (!C || typeof C.use !== 'function') { S.status = 'nodb'; render(true); return; }
  const [db, user, sample, dl, assets] = await Promise.all(['db', 'user', 'sample', 'downloads', 'assets'].map(n => Promise.resolve(C.use(n)).catch(() => null)));
  S.sample = sample; S.dl = dl; S.assets = assets;
  if (sample) { try { const lim = await sample.limits(); S.canImg = !!lim.images; S.canTools = !!lim.tools; } catch (e) {} }
  if (!db || !user) { S.status = 'nodb'; render(true); return; }
  let uid = null; try { uid = await user.id(); } catch (e) {}
  if (!uid) { S.status = 'nodb'; render(true); return; }
  S.db = db; S.uid = uid;
  const onErr = e => { console.warn('db', e); if (e && (e.code === 'revoked' || e.code === 'not_granted')) { S.status = 'nodb'; render(true); } };
  col('panels').onSnapshot(snap => {
    S.panels = snap.docs.map(d => ({ id: d.id, ...clone(d.data()) })).sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
    S.got.panels = true;
    if (snap.empty && !snap.metadata.fromCache) seedPanels();
    ready();
  }, onErr);
  col('records').onSnapshot(snap => { S.records = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byDateDesc); S.got.records = true; ready(); }, onErr);
  col('goals').onSnapshot(snap => { S.goals = snap.docs.map(d => ({ id: d.id, ...clone(d.data()) })); S.got.goals = true; ready(); }, onErr);
  profRef().onSnapshot(snap => { S.profile = snap.exists ? clone(snap.data()) : {}; S.got.profile = true; ready(); }, onErr);
}

  if (S.got.panels && S.got.records && S.got.goals && S.got.profile && S.panels.length) {

}

/* ============ 指标计算 ============ */
function mRecs(g, m) {
  const end = g.end || '9999-12-31';
  return S.records.filter(r => r.panel === m.panel && r.date >= g.start && r.date <= end
    && (!m.filterField || String(r.values?.[m.filterField] ?? '') === String(m.filterValue ?? ''))
    && (m.agg === 'count' || isNum(r.values?.[m.field])));
}
function dailyMap(recs, m) {
  const map = new Map();
  for (const r of [...recs].sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt || 0) - (b.createdAt || 0))) {
    const v = m.agg === 'count' ? 1 : Number(r.values[m.field]);
    const o = map.get(r.date) || { sum: 0, n: 0, last: null };
    o.sum += v; o.n += 1; o.last = v; map.set(r.date, o);
  }
  return [...map.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}
function mValue(g, m) {
  const recs = mRecs(g, m); if (!recs.length) return null;
  const days = dailyMap(recs, m);
  if (m.agg === 'count') return recs.length;
  if (m.agg === 'sum') return days.reduce((s, [, o]) => s + o.sum, 0);
  if (m.agg === 'avg') return days.reduce((s, [, o]) => s + o.sum, 0) / recs.length;
  if (m.agg === 'daysum') return days.reduce((s, [, o]) => s + o.sum, 0) / days.length;
  return days[days.length - 1][1].last;
}

  const days = dailyMap(mRecs(g, m), m); let run = 0;
  return days.map(([d, o]) => {
    if (m.agg === 'sum' || m.agg === 'count') { run += o.sum; return { d, v: run }; }
    if (m.agg === 'avg') return { d, v: o.sum / o.n };
    if (m.agg === 'daysum') return { d, v: o.sum };
    return { d, v: o.last };

}
function weekCounts(g, m, maxWeeks = 60) {
  const recs = mRecs(g, m); const last = (g.end && g.end < today()) ? g.end : today();
  const out = []; let w = weekStart(g.start); const lastW = weekStart(last);
  while (w <= lastW && out.length < 400) { out.push({ k: w, v: 0 }); w = addDays(w, 7); }
  const idx = new Map(out.map((o, i) => [o.k, i]));
  for (const r of recs) { const i = idx.get(weekStart(r.date)); if (i != null) out[i].v += 1; }
  return out.slice(-maxWeeks);
}
function thisWeekCount(g, m) { const ws = weekStart(today()); return mRecs(g, m).filter(r => r.date >= ws).length; }
function habitAdherence(g, m) {
  const weeks = weekCounts(g, m, 400); if (!weeks.length) return null;
  const cur = weekStart(today()); const per = Number(m.perWeek) || 1; let met = 0, denom = 0;
  for (const w of weeks) { const done = w.v >= per; if (w.k < cur) { denom++; if (done) met++; } else if (done) { denom++; met++; } }
  return denom ? met / denom : null;
}
function mProgress(g, m) {
  if (isNum(m.perWeek)) return habitAdherence(g, m);
  if (!isNum(m.target)) return null;
  const cur = mValue(g, m); const t = Number(m.target);
  if (m.agg === 'latest') { if (cur == null) return 0; if (!isNum(m.start)) return null; const s = Number(m.start); if (s === t) return 1; return clamp((s - cur) / (s - t)); }
  if (m.agg === 'sum' || m.agg === 'count') return t ? clamp((cur || 0) / t) : null;
  return null;
}
function goalProgress(g) {
  const mains = (g.metrics || []).filter(m => m.main);
  const vals = mains.map(m => mProgress(g, m)).filter(x => x != null);
  const ms = g.milestones || [];
  if (ms.length && (g.type === 'project' || !vals.length)) vals.push(ms.filter(x => x.done).length / ms.length);
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function goalExpected(g) { const span = daysBetween(g.start, g.end || `${YEAR}-12-31`); return span > 0 ? clamp(daysBetween(g.start, today()) / span) : 1; }
function goalHasData(g) { return (g.metrics || []).some(m => mRecs(g, m).length) || (g.milestones || []).some(x => x.done); }
function goalStatus(g) {

  if (p >= 0.999) return { k: 'ok', t: '达成', c: 'green' };

  if (mains.length && mains.every(m => isNum(m.perWeek))) return p >= 0.8 ? { k: 'ok', t: '稳定', c: 'green' } : p >= 0.5 ? { k: 'warn', t: '波动', c: 'orange' } : { k: 'bad', t: '掉线', c: 'red' };

/* ============ 板块核心数字（Dashboard 用） ============ */
function sumField(recs, k) { return recs.reduce((s, r) => s + (isNum(r.values?.[k]) ? Number(r.values[k]) : 0), 0); }
function kpiFor(p) {

  const latestF = nf.find(f => ['斤', 'kg', 'cm'].includes(f.unit));

  if (isEntity(p)) {
    const bf = boardField(p); const open = recs.filter(r => !isClosed(p, r));
    const due = reminders('0000-01-01', td).filter(x => x.panel === p.id).length;
    let sub = bf ? (bf.options || []).filter(o => !(p.closed || []).includes(o)).map(o => [o, recs.filter(r => r.values?.[bf.key] === o).length]).filter(x => x[1]).slice(0, 3).map(([o, n]) => `${o} ${n}`).join(' · ') : '';
    if (due) sub = `⏰ ${due} 个到期${sub ? ' · ' + sub : ''}`;
    return { v: String(open.length), unit: bf && (p.closed || []).length ? '个进行中' : '个', sub: sub || (recs.length ? `共 ${recs.length} 个` : '还没有'), spark: null };
  }

  if (yuanF) { const weeks = []; for (let i = 7; i >= 0; i--) { const w = addDays(ws, -7 * i); weeks.push(sumField(recs.filter(r => weekStart(r.date) === w), yuanF.key)); } return { v: fmtNum(weeks[7]), unit: '元', sub: `本周 ${week.length} 笔`, spark: weeks }; }

  }

    if (!vs.length) return { v: '—', unit: latestF.unit, sub: `还没有${latestF.label}记录`, spark: null };
    const last = vs[vs.length - 1]; const lv = Number(last.values[latestF.key]);
    const prev = [...vs].reverse().find(r => r.date <= addDays(last.date, -7));
    const delta = prev ? lv - Number(prev.values[latestF.key]) : null;
    return { v: fmtNum(lv), unit: latestF.unit, sub: `${latestF.label} · ${md(last.date)}${delta != null ? ` · 较一周前 ${delta > 0 ? '+' : ''}${fmtNum(delta)}` : ''}`, spark: vs.slice(-30).map(r => Number(r.values[latestF.key])) };
  }

    return { v: fmtNum(daily[13]), unit: 'kcal', sub: `今天 · 本周 ${week.length} 条记录`, spark: daily };
  }
  if (minF) {
    const weeks = []; for (let i = 7; i >= 0; i--) { const w = addDays(ws, -7 * i); weeks.push(sumField(recs.filter(r => weekStart(r.date) === w), minF.key)); }
    return { v: fmtNum(weeks[7]), unit: '分钟', sub: `本周 ${week.length} 次`, spark: weeks };
  }

/* ============ 图表 ============ */
function svgLine(o) {
  if (!o.pts.length) return `<div class="empty-chart">还没有数据，记一条就会出现曲线</div>`;
  const W = 640, H = 200, L = 46, R = 64, T = 18, B = 28;
  const span = Math.max(1, daysBetween(o.x0, o.x1));
  const X = d => L + clamp(daysBetween(o.x0, d) / span) * (W - L - R);
  let tg = null;
  if (o.tgt) { const [a, b] = o.tgt; const sp = Math.max(1, daysBetween(a.d, b.d)); const tv = d => a.v + (b.v - a.v) * daysBetween(a.d, d) / sp; tg = [{ d: o.x0, v: tv(o.x0) }, { d: o.x1, v: tv(o.x1) }]; }

  let lo = Math.min(...vals), hi = Math.max(...vals); if (o.zero) lo = Math.min(0, lo);
  if (lo === hi) { lo -= 1; hi += 1; } const pad = (hi - lo) * 0.12; hi += pad; if (!o.zero) lo -= pad;
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || '曲线')}">`;
  for (let i = 0; i <= 2; i++) { const v = lo + (hi - lo) * (i / 2); const y = Y(v); s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ax" x="${L - 6}" y="${y + 4}" text-anchor="end">${fmtNum(v)}</text>`; }
  s += `<text class="ax" x="${L}" y="${H - 8}">${md(o.x0)}</text><text class="ax" x="${W - R}" y="${H - 8}" text-anchor="end">${md(o.x1)}</text>`;
  const td = today(); if (td > o.x0 && td < o.x1) { const x = X(td); s += `<line class="td" x1="${x}" x2="${x}" y1="${T}" y2="${H - B}"/><text class="ax" x="${x}" y="${T - 5}" text-anchor="middle">今天</text>`; }
  if (tg) s += `<polyline class="tg" points="${X(tg[0].d)},${Y(tg[0].v)} ${X(tg[1].d)},${Y(tg[1].v)}"/>`;
  if (o.hline != null) s += `<line class="tg" x1="${L}" x2="${W - R}" y1="${Y(o.hline)}" y2="${Y(o.hline)}"/>`;
  const pts = o.pts.map(p => [X(p.d), Y(p.v)]);
  if (pts.length > 1) { const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); s += `<path class="ar" d="${d} L${pts[pts.length - 1][0].toFixed(1)} ${H - B} L${pts[0][0].toFixed(1)} ${H - B} Z"/><path class="ln" d="${d}"/>`; }
  const lp = pts[pts.length - 1]; const lv = o.pts[o.pts.length - 1].v;
  s += `<circle class="pt" cx="${lp[0]}" cy="${lp[1]}" r="4"/><text class="lb" x="${lp[0] + 8}" y="${lp[1] + 4}">${fmtNum(lv)}${esc(o.unit || '')}</text>`;
  return s + '</svg>';
}
function svgBars(o) {
  if (!o.bars.length || o.bars.every(b => !b.v)) return `<div class="empty-chart">还没有数据</div>`;
  const W = 640, H = 170, L = 40, R = 14, T = 14, B = 26;
  const max = Math.max(...o.bars.map(b => b.v), o.hline || 0, 1) * 1.15;
  const bw = (W - L - R) / o.bars.length; const Y = v => T + (1 - v / max) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || '每周')}">`;
  for (const v of [0, max / 2]) { const y = Y(v); s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ax" x="${L - 6}" y="${y + 4}" text-anchor="end">${fmtNum(v)}</text>`; }
  o.bars.forEach((b, i) => { const x = L + i * bw + bw * 0.18, w = bw * 0.64, y = Y(b.v); s += `<rect class="bar ${o.hline == null || b.v >= o.hline ? 'met' : ''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, H - B - y).toFixed(1)}" rx="3"><title>${esc(b.label)}: ${fmtNum(b.v)}</title></rect>`; });
  const step = Math.max(1, Math.ceil(o.bars.length / 6));

  if (o.hline != null) s += `<line class="tg" x1="${L}" x2="${W - R}" y1="${Y(o.hline)}" y2="${Y(o.hline)}"/>`;
  return s + '</svg>';
}
function metricChart(g, m) {

function heatmap() {

  const cnt = new Map(); for (const r of S.records) if (r.date >= start && r.date <= end) cnt.set(r.date, (cnt.get(r.date) || 0) + 1);

function calHtml(recs, month, panelId) {

  const byDay = new Map(); for (const r of recs) { if (r.date < start || r.date > end) continue; if (!byDay.has(r.date)) byDay.set(r.date, []); byDay.get(r.date).push(r); }

}

function panelStats(p) {
  const weeks = []; let w = addDays(weekStart(today()), -11 * 7); for (let i = 0; i < 12; i++) { weeks.push(w); w = addDays(w, 7); }
  const recs = S.records.filter(r => r.panel === p.id && r.date >= weeks[0]);

  const blocks = [{ label: '每周记录次数', bars: weeks.map(x => ({ label: md(x), v: groups.get(x).length })) }];

    const avg = f.type === 'rating' || ['斤', 'kg', 'cm', '小时'].includes(f.unit);

  return `<div class="metric-grid">${blocks.map(b => `<div class="mcard"><h3 style="font-size:15px">${esc(b.label)}</h3>${svgBars({ bars: b.bars, label: b.label })}</div>`).join('')}</div>`;

function mdLite(t) {
  const inl = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\[\[([^\]\n]{1,60})\]\]/g, '<a class="wl" data-act="search" data-q="$1">$1</a>');
  let out = '', list = false;
  for (const raw of esc(t).split('\n')) {
    const l = raw.trimEnd(); const m = l.match(/^\s*(?:[-*•]|\d+[.)、])\s+(.*)/);
    if (m) { if (!list) { out += '<ul>'; list = true; } out += `<li>${inl(m[1])}</li>`; continue; }
    if (list) { out += '</ul>'; list = false; }
    if (/^#{1,4}\s/.test(l)) { out += `<h4>${inl(l.replace(/^#+\s*/, ''))}</h4>`; continue; }
    if (l.trim()) out += `<p>${inl(l)}</p>`;

  return out + (list ? '</ul>' : '');
}

function sanitizeDraft(r) {
  const p = panelById(r?.panel) || panelById('notes') || S.panels[0];
  const values = {}; const extra = [];
  for (const [k, v0] of Object.entries(r?.values || {})) {
    const f = p.fields.find(x => x.key === k); if (!f || v0 === null || v0 === undefined || v0 === '') continue;
    let v = v0;
    if (f.type === 'check') v = v === true || v === 'true' || v === 1 || v === '是';
    else if (f.type === 'number') { if (!isNum(v)) { extra.push(`${f.label}:${v}`); continue; } v = Number(v); }
    else if (f.type === 'rating') { if (!isNum(v)) continue; v = Math.round(clamp(Number(v), 1, f.max || 5)); }
    else if (f.type === 'select') { v = String(v); if (!(f.options || []).includes(v)) { extra.push(`${f.label}:${v}`); continue; } }
    else if (f.type === 'date') { if (!validDate(v)) { extra.push(`${f.label}:${v}`); continue; } v = String(v); }
    else v = String(v);
    values[k] = v;
  }
  const note = [String(r?.note || ''), ...extra].filter(Boolean).join('；');
  return { panel: p.id, date: validDate(r?.date) ? r.date : today(), values, note };
}
function findEntity(p, name) {
  const tk = titleKeyOf(p); const m = String(name || '').trim().toLowerCase(); if (!m || !tk) return null;
  const list = S.records.filter(x => x.panel === p.id);
  return list.find(x => String(x.values?.[tk] || '').trim().toLowerCase() === m) || list.find(x => { const t = String(x.values?.[tk] || '').toLowerCase(); return t && (t.includes(m) || m.includes(t)); }) || null;
}
function matchDraft(r) {
  const p = panelById(r?.panel); if (!p || !isEntity(p) || !r.match) return sanitizeDraft(r);
  const old = findEntity(p, r.match); const tk = titleKeyOf(p);
  if (!old) return sanitizeDraft({ ...r, values: { [tk]: String(r.match), ...(r.values || {}) } });
  const nd = sanitizeDraft(r);
  return { id: old.id, panel: p.id, date: old.date, evDate: nd.date, values: { ...clone(old.values || {}), ...nd.values }, note: nd.note, update: true };
}

async function saveRecordDoc(d, rawId) {
  const p = panelById(d.panel); if (!p) return;

    if (v === undefined || v === null || v === '') continue;
    if (f.type === 'number' || f.type === 'rating') { if (!isNum(v)) continue; v = Number(v); } else v = String(v);
    values[f.key] = v;
  }
  const old = d.id ? recById(d.id) : null;
  if (old) for (const k of Object.keys(old.values || {})) if (!(k in values) && !p.fields.some(f => f.key === k)) values[k] = old.values[k];
  const doc = { panel: p.id, date: validDate(d.date) ? d.date : today(), values, note: String(d.note || '').slice(0, 4000) };
  if (old) {
    Object.assign(doc, { source: old.source || 'manual', createdAt: old.createdAt || Date.now(), updatedAt: Date.now() });
    if (old.raw) doc.raw = old.raw; if (old.rawId) doc.rawId = old.rawId;
    if (d.update) doc.note = [old.note || '', d.note ? `${md(d.evDate || today())} ${d.note}` : ''].filter(Boolean).join('\n').slice(-4000);
    if (isEntity(p)) {
      const ch = p.fields.filter(f => f.type !== 'longtext' && JSON.stringify(old.values?.[f.key] ?? '') !== JSON.stringify(values[f.key] ?? '')).map(f => `${f.label}：${fmtVal(f, old.values?.[f.key])} → ${fmtVal(f, values[f.key])}`);
      const t = [ch.join('；'), d.update ? d.note : ''].filter(Boolean).join(' · ');
      doc.log = [...clone(old.log || []), ...(t ? [{ d: d.evDate || today(), t: t.slice(0, 300) }] : [])].slice(-60);
    }
    await write(() => col('records').doc(d.id).set(doc));
  } else {
    doc.source = S.draftMode === 'capture' && S.sample ? 'ai' : S.draftMode === 'import' ? 'import' : 'manual';
    doc.createdAt = Date.now();
    if (isEntity(p)) doc.log = [{ d: doc.date, t: '新建' }];
    if (S.draftMode === 'capture' && S.draftRaw) { doc.raw = S.draftRaw.slice(0, 2000); if (rawId) doc.rawId = rawId; }
    await write(() => col('records').doc(uidGen()).set(doc));

}
async function saveDrafts(btn) {

function parseWeread(text) {
  let book = '', author = '', chapter = ''; const items = []; let cur = null;
  for (const raw of text.split(/\r?\n/)) {
    const l = raw.trim(); if (!l) continue; let m;
    if (!book && (m = l.match(/^《(.+?)》/))) { book = m[1]; continue; }
    if (/^\d+\s*个笔记$/.test(l) || /^点评|^发表想法|^\d{4}\/\d{1,2}\/\d{1,2}/.test(l)) continue;
    if (book && !author && !items.length && !chapter && !/^[◆>]/.test(l) && l.length < 30) { author = l; continue; }
    if (l.startsWith('◆')) { chapter = l.replace(/^◆\s*/, ''); continue; }
    if (/^>+/.test(l)) { cur = { kind: '划线', book, author, chapter, quote: l.replace(/^>+\s*/, ''), thought: '' }; items.push(cur); continue; }
    if ((m = l.match(/^原文[:：]\s*(.*)/))) { if (cur && cur.kind === '想法' && !cur.quote) cur.quote = m[1]; continue; }
    cur = { kind: '想法', book, author, chapter, quote: '', thought: l }; items.push(cur);
  }
  return items;
}
function importHtml() {
  return `<h3>📖 导入读书笔记</h3>
  <p class="muted" style="font-size:13.5px">在微信读书里打开一本书的「笔记」，导出或复制全部笔记，粘贴到这里。Kindle 的 My Clippings、其他 App 的笔记文本也可以，AI 会识别书名、章节、划线和想法。</p>
  <textarea id="imp-text" rows="10" placeholder="《置身事内》&#10;兰小欢&#10;&#10;◆ 第一章 地方政府的权力与事务&#10;&#10;>> 划线原文……">${esc(S.imp.text)}</textarea>
  <p class="muted" id="imp-status" style="font-size:13px"></p>
  <div class="m-foot"><button class="btn ghost" data-act="closeModal">取消</button><button class="btn" data-act="importRule">按格式直接拆</button><button class="btn primary" data-act="importAI" ${S.sample ? '' : 'disabled'}>AI 整理</button></div>`;
}
function importToDrafts(items, bookHint) {
  return items.filter(it => it && (it.quote || it.thought)).map(it => sanitizeDraft({ panel: 'reading', date: today(), values: { kind: ['划线', '想法', '阅读', '读完'].includes(it.kind) ? it.kind : (it.quote ? '划线' : '想法'), book: it.book || bookHint || '', author: it.author || '', chapter: it.chapter || '', quote: it.quote || '', thought: it.thought || '' } }));

async function importAI(btn) {
  const text = $('#imp-text').value.trim(); S.imp.text = text; if (!text) { toast('先粘贴笔记'); return; }
  if (!panelById('reading')) { toast('找不到「读书」板块'); return; }
  const chunks = []; let buf = '';
  for (const part of text.split(/(?=^◆)/m)) { if ((buf + part).length > 9000 && buf) { chunks.push(buf); buf = ''; } buf += part; }
  if (buf) chunks.push(buf);
  btn.disabled = true; const st = $('#imp-status'); const all = []; let book = '', author = '';
  try {

      const out = await S.sample.json(`下面是从阅读软件（多半是微信读书）导出的读书笔记${book ? `，书名《${book}》，作者 ${author}` : ''}。把它拆成记录，原文一字不改。

忽略"X个笔记""发表想法"、日期这类辅助行。
只回 JSON：{"book":"书名","author":"作者","items":[...]}

笔记：
"""
${chunks[i]}
"""`, { modelTier: 'quick' });
      if (out?.book && !book) book = String(out.book).replace(/[《》]/g, ''); if (out?.author && !author) author = String(out.author);

${body ? '3. 安全底线：目标 BMI 不低于 18.5；体重下降每周不超过体重的 0.5–1%；每日热量不低于估算基础代谢；以力量训练保肌、充足蛋白质为核心，不推荐节食、断碳、代餐、极端方法。目标或期限不安全、不现实时，给出调整后的目标，并在 summary 说明原因。体态问题（圆肩、骨盆前倾等）给出对应的纠正训练。' : '3. 计划必须现实可执行，期限不合理时给出调整建议并在 summary 说明。'}
4. 必须尊重她的原则。
5. metrics：2-6 个，用现有板块字段自动追踪，main 选 1-2 个。agg：latest（最新值，体重、腰围）、sum（累计）、count（计数，field 写 "__count"，可用 filterField/filterValue 只算某一类，如只算力量训练）、avg、daysum（日均合计，如每日热量、蛋白质）。perWeek 表示每周至少几次。
6. 现有板块缺字段时，在 newFields 里给它加：{"panel":"板块id","label":"","type":"number|text|select|rating|date","unit":""}，metrics 里用 "new:字段label" 作为 field 引用。缺整个板块时用 newPanels：{"id":"英文小写","name":"","icon":"","fields":[{"key":"","label":"","type":"","unit":"","options":[]}]}。
7. phases：从开始到截止拆成 2-4 个阶段 {name,start,end,focus,targets:[{label,value}]}，日期连续。
8. milestones：每月一个检查点 {text,date}，text 带具体数字。
9. weekly：每周模板 {"training":[{"day":"周一","title":"","detail":"具体动作、组数次数或时长","panel":"板块id或空","preset":{字段key:值}}],"nutrition":["具体可执行的饮食规则"],"habits":["具体习惯"]}。
10. firstWeekFocus 一句话；firstWeek：本周 3-8 条待办 [{"text":"哪天做什么","panel":"","preset":{}}]，第一条一般是记录起点数据。
11. obstacles：2-3 条 {obstacle,strategy}。end：现实的截止日 YYYY-MM-DD。

只回 JSON：{"title":"","vision":"","icon":"","area":"","type":"outcome|cumulative|habit|project","start":"${today()}","end":"","assessment":{"summary":"","items":[]},"metrics":[],"newFields":[],"newPanels":[],"phases":[],"milestones":[],"weekly":{},"firstWeekFocus":"","firstWeek":[],"obstacles":[]}`);
    const addFields = {};
    for (const nf of arr(out?.newFields)) { const p = panelById(nf?.panel); if (!p || !nf.label) continue; const f = sanitizeField({ label: nf.label, type: nf.type, unit: nf.unit, options: nf.options, remind: nf.remind }); if (p.fields.some(x => x.label === f.label) || (addFields[p.id] || []).some(x => x.label === f.label)) continue; (addFields[p.id] = addFields[p.id] || []).push(f); }
    const newPanels = makeNewPanels(out?.newPanels);
    for (const m of arr(out?.metrics)) { const np = newPanels.find(x => x.oldId === m.panel); if (np) m.panel = np.id; }
    const pv0 = { addFields, newPanels }; const aug = augPanels(pv0);
    for (const m of arr(out?.metrics)) if (String(m.field || '').startsWith('new:')) { const lab = m.field.slice(4); const p = aug.find(x => x.id === m.panel); m.field = (p?.fields.find(f => f.label === lab) || p?.fields.find(f => f.label === lab.trim()) || {}).key || ''; }
    const plan = {
      domain: it.domain, intake: answers,
      assessment: { summary: String(out?.assessment?.summary || '').slice(0, 800), items: arr(out?.assessment?.items).slice(0, 12).map(x => ({ label: String(x?.label || '').slice(0, 24), value: String(x?.value ?? '').slice(0, 40), note: String(x?.note || '').slice(0, 140) })) },
      phases: arr(out?.phases).slice(0, 6).map(ph => ({ id: uidGen(), name: String(ph?.name || '').slice(0, 30), start: validDate(ph?.start) ? ph.start : '', end: validDate(ph?.end) ? ph.end : '', focus: String(ph?.focus || '').slice(0, 240), targets: arr(ph?.targets).slice(0, 6).map(t => ({ label: String(t?.label || '').slice(0, 20), value: String(t?.value ?? '').slice(0, 30) })) })),
      weekly: { training: arr(out?.weekly?.training).slice(0, 10).map(t => { const pid = aug.some(p => p.id === t?.panel) ? t.panel : ''; return { day: String(t?.day || '').slice(0, 8), title: String(t?.title || '').slice(0, 40), detail: String(t?.detail || '').slice(0, 240), panel: pid, preset: pid ? cleanPreset(pid, t.preset, aug) : {} }; }), nutrition: arr(out?.weekly?.nutrition).slice(0, 10).map(x => String(x).slice(0, 160)), habits: arr(out?.weekly?.habits).slice(0, 8).map(x => String(x).slice(0, 120)) }
    };
    const weeks = { [ws]: { focus: String(out?.firstWeekFocus || '').slice(0, 240), adjust: '', items: arr(out?.firstWeek).slice(0, 10).map(x => weekItem(x, aug)).filter(x => x.text) } };
    const goal = buildGoalDoc({ ...out, name: String(out?.title || it.title || '新目标').slice(0, 16), vision: String(out?.vision || desc).slice(0, 200), why: '', hue: HUES[Math.floor(Math.random() * HUES.length)], metrics: arr(out?.metrics).map(m => sanitizeMetric(m, aug)), plan, weeks });
    if (g0) goal.start = g0.start;
    S.ng.preview = { goal, addFields, newPanels }; S.ng.step = 'plan';
    $('#modal-body').innerHTML = newGoalHtml();
  } catch (e) { toast(aiErr(e)); btn.disabled = false; btn.textContent = '生成计划 ✨'; }
}

function trimWeeks(w) { const ks = Object.keys(w).sort(); for (const k of ks.slice(0, Math.max(0, ks.length - 16))) delete w[k]; return w; }
async function genWeek(btn, which) {
  const g = goalById(S.view.id); if (!g) return;
  const cur = weekStart(today()); const ws = which === 'next' ? addDays(cur, 7) : cur; const prev = addDays(ws, -7);
  const panels = [...new Set((g.metrics || []).map(m => m.panel))];
  const recent = S.records.filter(r => panels.includes(r.panel) && r.date >= addDays(prev, -7)).slice(0, 120).map(recLine).join('\n');
  const lastWk = g.weeks?.[prev] || (which !== 'next' ? null : g.weeks?.[cur]);
  btn.disabled = true; btn.textContent = '生成中…';
  try {
    const out = await S.sample.json(`你是她这个目标的专业教练。为 ${ws} 开始的这一周制定计划。
今天是 ${today()}（星期${WEEKDAY[new Date().getDay()]}）。${which === 'cur' && g.weeks?.[cur] ? '这是本周的重排：已经过去的日子不要再安排，已完成的项保留。' : ''}
${profileText()}
目标：${JSON.stringify(goalBrief(g))}
每周模板：${JSON.stringify(g.plan?.weekly || {})}
${lastWk ? `上一周计划和完成情况：${JSON.stringify(lastWk.items.map(x => (x.done ? '✓ ' : '✗ ') + x.text))}` : '没有上一周的计划记录。'}
${which === 'cur' && g.weeks?.[cur] ? `本周当前计划：${JSON.stringify(g.weeks[cur].items.map(x => (x.done ? '✓ ' : '○ ') + x.text))}` : ''}
近期相关记录：
${recent || '（没有）'}
板块和字段：${schemaText()}

规则：根据完成度和数据调整：完成度低就减量、写得更具体；进展慢就调整饮食或训练；进展太快或疲劳就放缓。3-8 条，具体到哪天做什么；能对应到板块的给 panel 和 preset（字段 key: 值），方便她一键记录。必须符合她的原则和安全底线。
只回 JSON：{"focus":"本周重点一句话","adjust":"相比模板或上周调整了什么、为什么，一句话","items":[{"text":"","panel":"","preset":{},"done":false}]}`);
    const items = arr(out?.items).slice(0, 10).map(x => ({ ...weekItem(x, S.panels), done: !!x?.done })).filter(x => x.text);
    if (!items.length) throw { code: 'invalid_json' };
    const weeks = trimWeeks({ ...clone(g.weeks || {}), [ws]: { focus: String(out?.focus || '').slice(0, 240), adjust: String(out?.adjust || '').slice(0, 240), items } });
    await saveGoal({ ...clone(g), weeks }); toast(which === 'next' ? '下周计划已生成' : '本周计划已更新');
  } catch (e) { toast(e?.code ? aiErr(e) : writeErr(e)); btn.disabled = false; btn.textContent = '重试'; }
}

function queryRecords(i) {

  if (validDate(i.from)) recs = recs.filter(r => r.date >= i.from);
  if (validDate(i.to)) recs = recs.filter(r => r.date <= i.to);
  if (i.field && i.value != null && i.value !== '') recs = recs.filter(r => String(r.values?.[i.field] ?? '') === String(i.value));
  if (i.text) { const q = String(i.text).toLowerCase(); recs = recs.filter(r => recText(r).toLowerCase().includes(q)); }
  const lim = Math.min(200, Math.max(1, Number(i.limit) || 60));
  return { total: recs.length, records: recs.slice(0, lim).map(recLine) };
}

const localAI = () => { try { return JSON.parse(localStorage.getItem('lifeos.ai') || '{}'); } catch (e) { return {}; } };

    blobUrl: id => LOCAL_BLOBS.get(id) || '',

    kind: 'supabase',
    async load() {

function installStandalone(store) {

  const cp = x => x === undefined ? undefined : JSON.parse(JSON.stringify(x));
  const parentOf = p => p.split('/').slice(0, -1).join('/');
